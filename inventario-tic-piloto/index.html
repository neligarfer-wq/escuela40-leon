<body><div id="app"></div><script>
(()=>{'use strict';
const KEY='inventario-tic-leon-piloto-v1';
const categories=['Equipos informáticos','Dispositivos móviles','Paneles y proyectores','Impresión y digitalización','Redes y conectividad','Robótica y programación','Fabricación digital','Audiovisuales','Periféricos','Otros'];
const centers=[{id:'DEMO-001',name:'Centro Piloto A',type:'CEIP',city:'León'},{id:'DEMO-002',name:'Centro Piloto B',type:'IES',city:'Ponferrada'},{id:'DEMO-003',name:'Centro Piloto C',type:'CRA',city:'Astorga'},{id:'DEMO-004',name:'Centro Piloto D',type:'CIFP',city:'La Bañeza'},{id:'DEMO-005',name:'Centro Piloto E',type:'CEIP',city:'Villablino'}];
const makeItem=(id,center,category,type,brand,model,ok,broken,obsolete,location,available=0)=>({id,center,category,type,brand,model,ok,broken,obsolete,location,available,source:'Dotación educativa',year:'2023',notes:''});
const seed=()=>({centers,inventory:[makeItem('I1','DEMO-001',categories[0],'Ordenador portátil','HP','ProBook',22,2,1,'Aula de informática',3),makeItem('I2','DEMO-001',categories[2],'Panel digital','SMART','Serie MX',8,0,0,'Aulas',0),makeItem('I3','DEMO-001',categories[5],'Placa programable','BBC','micro:bit V2',14,1,0,'Aula STEAM',0),makeItem('I4','DEMO-001',categories[6],'Impresora 3D','Creality','K1C',2,0,0,'Aula maker',0),makeItem('I5','DEMO-002',categories[0],'Ordenador de sobremesa','Dell','OptiPlex',34,3,2,'Laboratorio TIC',2),makeItem('I6','DEMO-002',categories[5],'Robot','LEGO','SPIKE Prime',9,0,0,'Tecnología',0),makeItem('I7','DEMO-003',categories[2],'Panel digital','SMART','Serie MX',4,0,0,'Aulas',0),makeItem('I8','DEMO-003',categories[0],'Ordenador portátil','Lenovo','ThinkPad',12,1,1,'Aula TIC',0),makeItem('I9','DEMO-004',categories[6],'Impresora 3D','Creality','K1C',3,1,0,'Taller',0),makeItem('I10','DEMO-005',categories[7],'Micrófono','Shure','SM58',4,0,0,'Radio escolar',0)],needs:[{id:'N1',center:'DEMO-001',category:categories[0],item:'Ordenadores portátiles',qty:8,priority:'Alta',reason:'Ampliación',details:'Renovar parte del aula de informática.',status:'Registrada',campaign:'C1'},{id:'N2',center:'DEMO-003',category:categories[5],item:'Kits de robótica',qty:5,priority:'Media',reason:'Nueva necesidad',details:'Actividades de programación.',status:'Registrada',campaign:'C1'}],campaigns:[{id:'C1',name:'Piloto de inventario 2026-2027',start:'2026-11-16',end:'2027-01-30',status:'Abierta'}],activeCampaign:'C1',submissions:{},history:[{at:new Date().toISOString(),label:'Datos de demostración inicializados'}]});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.inventory)&&Array.isArray(v.campaigns))return v}catch(_){}return seed()}
let data=load();let ui={role:'centro',center:'DEMO-001',page:'inicio',filter:'',category:'',modal:null};
const $=s=>document.querySelector(s), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=x=>Number(x||0).toLocaleString('es-ES');const campaign=()=>data.campaigns.find(c=>c.id===data.activeCampaign);const center=()=>data.centers.find(c=>c.id===ui.center)||data.centers[0];const total=i=>i.ok+i.broken+i.obsolete;const isEditable=()=>campaign()?.status==='Abierta'&&!data.submissions[`${campaign().id}|${ui.center}`];const store=()=>{localStorage.setItem(KEY,JSON.stringify(data));};const log=s=>{data.history.unshift({at:new Date().toISOString(),label:s});data.history=data.history.slice(0,250)};const toast=s=>{document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3300)};
const btn=(label,fn='')=>`<button class="btn" ${fn?`data-act="${fn}"`:''}>${label}</button>`;
function nav(){const admin=ui.role==='admin';return (admin?[['inicio','⌂','Resumen provincial'],['centros','▦','Centros'],['inventario','▤','Inventario provincial'],['necesidades','✚','Necesidades'],['campanas','◷','Campañas'],['informes','▥','Informes'],['historial','↺','Historial']]:[['inicio','⌂','Mi centro'],['inventario','▤','Mi inventario'],['necesidades','✚','Necesidades'],['envio','✓','Revisión y envío'],['historial','↺','Historial']]).map(([id,icon,name])=>`<button data-page="${id}" class="${id===ui.page?'active':''}"><span class="navico">${icon}</span>${name}</button>`).join('')}
function heading(title,desc,buttons=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function stat(icon,label,n,foot=''){return `<div class="stat"><span class="icon">${icon}</span><span class="label">${label}</span><div class="value">${number(n)}</div><div class="foot">${foot}</div></div>`}
function statusTag(s){return `<span class="pill ${s==='Abierta'||s==='Enviada'||s==='Atendida'?'':s==='Cerrada'||s==='Alta'?'warning':'gray'}">${escape(s)}</span>`}
function currentRows(){return data.inventory.filter(i=>ui.role==='admin'||i.center===ui.center)}
function dashboard(){if(ui.role==='admin'){const sent=data.centers.filter(c=>data.submissions[`${campaign()?.id}|${c.id}`]).length;const all=data.inventory;const units=all.reduce((s,i)=>s+total(i),0);return heading('Panel provincial','Visión general de los centros piloto y la campaña activa.')+`<div class="banner"><div><strong>Campaña: ${escape(campaign()?.name||'Sin campaña')}</strong><p>Estado: ${escape(campaign()?.status||'—')} · Alcance previsto: 232 centros · Cargados en el piloto: 5 ficticios</p></div>${statusTag(campaign()?.status||'Sin campaña')}</div><div class="cards">${stat('🏫','Centros piloto',5,'Objetivo futuro: 232')}${stat('▤','Unidades inventariadas',units,'Todos los centros piloto')}${stat('✚','Necesidades',data.needs.length,'Solicitudes registradas')}${stat('✓','Centros que han enviado',sent,'De 5 centros de demostración')}</div><div class="grid2"><section class="panel"><h2>Seguimiento de campaña</h2><p>${sent} de 5 centros han enviado su inventario.</p><div class="progress"><span style="width:${sent/5*100}%"></span></div>${data.centers.map(c=>`<div class="categorybar"><label>${escape(c.name)}</label><span class="pill ${data.submissions[`${campaign()?.id}|${c.id}`]?'':'gray'}">${data.submissions[`${campaign()?.id}|${c.id}`]?'Enviada':'Pendiente'}</span></div>`).join('')}</section><section class="panel"><h2>Resumen de equipamiento</h2>${categoryStats(all)}<p class="small">Información ficticia para comprobar los informes.</p></section></div>`}
const rows=currentRows();const n=data.needs.filter(x=>x.center===ui.center).length;return heading('Bienvenida, '+escape(center().name),'Actualiza el equipamiento tecnológico de tu centro durante la campaña.')+`<div class="banner ${!isEditable()?'warn':''}"><div><strong>${escape(campaign()?.name||'Sin campaña')}</strong><p>${!campaign()?'No hay campaña activa':campaign().status!=='Abierta'?'La campaña está cerrada. El inventario es de solo lectura.':data.submissions[`${campaign().id}|${ui.center}`]?'Inventario enviado. Solicita reapertura a administración para corregirlo.':'Campaña abierta. Puedes actualizar el inventario y comunicar necesidades.'}</p></div>${statusTag(data.submissions[`${campaign()?.id}|${ui.center}`]?'Enviada':campaign()?.status||'—')}</div><div class="cards">${stat('▤','Registros de material',rows.length)}${stat('◉','Equipos operativos',rows.reduce((s,i)=>s+i.ok,0))}${stat('⚠','Averiados',rows.reduce((s,i)=>s+i.broken,0))}${stat('✚','Necesidades',n)}</div><div class="grid2"><section class="panel"><h2>Accesos rápidos</h2><p>Gestiona las existencias y comunica las necesidades de tu centro.</p><div class="actions"><button class="btn primary" data-page="inventario">Consultar inventario</button><button class="btn" data-page="necesidades">Registrar necesidades</button><button class="btn" data-page="envio">Revisar y enviar</button></div></section><section class="panel"><h2>Estado del material</h2><p>Unidades registradas: <strong>${number(rows.reduce((s,i)=>s+total(i),0))}</strong></p><p>Obsoletas: <strong>${number(rows.reduce((s,i)=>s+i.obsolete,0))}</strong> · Disponibles para redistribución: <strong>${number(rows.reduce((s,i)=>s+i.available,0))}</strong></p></section></div>`}
function categoryStats(rows){const a=categories.map(c=>({name:c,count:rows.filter(i=>i.category===c).reduce((s,i)=>s+total(i),0)})).filter(x=>x.count);const max=Math.max(1,...a.map(x=>x.count));return a.length?a.map(x=>`<div class="categorybar"><label title="${escape(x.name)}">${escape(x.name)}</label><div class="bar"><span style="width:${100*x.count/max}%"></span></div><strong>${x.count}</strong></div>`).join(''):`<div class="empty">Sin datos</div>`}
function inventory(){const admin=ui.role==='admin';let rows=currentRows().filter(i=>[i.category,i.type,i.brand,i.model,i.location,data.centers.find(c=>c.id===i.center)?.name].join(' ').toLowerCase().includes(ui.filter.toLowerCase())&&(!ui.category||ui.category===i.category));return heading(admin?'Inventario provincial':'Mi inventario',admin?'Consulta global de existencias registradas.':'Registra materiales agrupados por cantidades y estado.',`<button class="btn" data-act="csv-inventory">Exportar CSV</button>${!admin?`<button class="btn" data-act="import">Importar CSV</button><button class="btn primary" data-act="new-item" ${!isEditable()?'disabled':''}>+ Añadir material</button>`:''}`)+`<section class="panel"><div class="tools"><input id="filter" class="field" placeholder="Buscar marca, modelo, ubicación..." value="${escape(ui.filter)}"><select id="category" class="field"><option value="">Todas las categorías</option>${categories.map(c=>`<option ${ui.category===c?'selected':''}>${escape(c)}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr>${admin?'<th>Centro</th>':''}<th>Material</th><th>Categoría / ubicación</th><th>Operativos</th><th>Averiados</th><th>Obsoletos</th><th>Total</th><th>Disponibles</th>${!admin?'<th>Acciones</th>':''}</tr></thead><tbody>${rows.map(i=>`<tr>${admin?`<td>${escape(data.centers.find(c=>c.id===i.center)?.name)}</td>`:''}<td><span class="name">${escape(i.brand)} ${escape(i.model)}</span><span class="sub">${escape(i.type)}</span></td><td>${escape(i.category)}<span class="sub">${escape(i.location)}</span></td><td>${i.ok}</td><td>${i.broken}</td><td>${i.obsolete}</td><td><strong>${total(i)}</strong></td><td>${i.available}</td>${!admin?`<td class="nowrap"><button class="tinybtn" data-edit="${escape(i.id)}" ${!isEditable()?'disabled':''}>Editar</button><button class="tinybtn" data-delete="${escape(i.id)}" ${!isEditable()?'disabled':''}>Eliminar</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${admin?8:8}" class="empty">No hay materiales para mostrar.</td></tr>`}</tbody></table></div><p class="small muted">${rows.length} grupos · ${number(rows.reduce((a,i)=>a+total(i),0))} unidades</p></section>`}
function needs(){const admin=ui.role==='admin';const rows=data.needs.filter(n=>(admin||n.center===ui.center)&&[n.category,n.item,n.priority,n.reason,n.details].join(' ').toLowerCase().includes(ui.filter.toLowerCase()));return heading(admin?'Necesidades provinciales':'Necesidades de equipamiento',admin?'Revisión de solicitudes de los centros piloto.':'Comunica las necesidades de equipamiento sin compromiso de suministro.',`<button class="btn" data-act="csv-needs">Exportar CSV</button>${!admin?`<button class="btn primary" data-act="new-need" ${!isEditable()?'disabled':''}>+ Nueva necesidad</button>`:''}`)+`<div class="banner warn"><div><strong>El registro de necesidades no supone una concesión.</strong><p>Las solicitudes están sujetas a estudio y disponibilidad.</p></div></div><section class="panel"><div class="tools"><input id="filter" class="field" placeholder="Filtrar necesidades..." value="${escape(ui.filter)}"></div><div class="tablewrap"><table><thead><tr>${admin?'<th>Centro</th>':''}<th>Material solicitado</th><th>Cantidad</th><th>Prioridad</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(n=>`<tr>${admin?`<td>${escape(data.centers.find(c=>c.id===n.center)?.name)}</td>`:''}<td><span class="name">${escape(n.item)}</span><span class="sub">${escape(n.category)} · ${escape(n.details)}</span></td><td>${n.qty}</td><td>${statusTag(n.priority)}</td><td>${escape(n.reason)}</td><td>${statusTag(n.status)}</td><td>${admin?`<button class="tinybtn" data-needstate="${escape(n.id)}">Gestionar</button>`:`<button class="tinybtn" data-neededit="${escape(n.id)}" ${!isEditable()?'disabled':''}>Editar</button><button class="tinybtn" data-needdelete="${escape(n.id)}" ${!isEditable()?'disabled':''}>Eliminar</button>`}</td></tr>`).join('')||`<tr><td class="empty" colspan="7">No hay solicitudes.</td></tr>`}</tbody></table></div></section>`}
function centersPage(){return heading('Centros educativos','En la primera fase se utilizan cinco centros ficticios. El objetivo final son 232.')+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>Código</th><th>Centro</th><th>Tipo</th><th>Municipio</th><th>Grupos</th><th>Estado</th><th></th></tr></thead><tbody>${data.centers.map(c=>`<tr><td>${escape(c.id)}</td><td class="name">${escape(c.name)}</td><td>${escape(c.type)}</td><td>${escape(c.city)}</td><td>${data.inventory.filter(i=>i.center===c.id).length}</td><td>${statusTag(data.submissions[`${campaign()?.id}|${c.id}`]?'Enviada':'Pendiente')}</td><td><button class="tinybtn" data-centeropen="${escape(c.id)}">Ver centro</button>${data.submissions[`${campaign()?.id}|${c.id}`]?`<button class="tinybtn" data-reopen="${escape(c.id)}">Reabrir</button>`:''}</td></tr>`).join('')}</tbody></table></div></section>`}
function campaignsPage(){return heading('Campañas de actualización','Abre y cierra periodos de cumplimentación y conserva el inventario entre ellos.','<button class="btn primary" data-act="new-campaign">+ Nueva campaña</button>')+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>Campaña</th><th>Periodo orientativo</th><th>Estado</th><th>Enviados</th><th>Acciones</th></tr></thead><tbody>${data.campaigns.map(c=>`<tr><td><span class="name">${escape(c.name)}</span>${data.activeCampaign===c.id?'<span class="sub">Campaña seleccionada</span>':''}</td><td>${escape(c.start)} — ${escape(c.end)}</td><td>${statusTag(c.status)}</td><td>${data.centers.filter(x=>data.submissions[`${c.id}|${x.id}`]).length}/5</td><td>${c.id!==data.activeCampaign?`<button class="tinybtn" data-activate="${escape(c.id)}">Seleccionar</button>`:''}<button class="tinybtn" data-togglecamp="${escape(c.id)}">${c.status==='Abierta'?'Cerrar':'Abrir'}</button></td></tr>`).join('')}</tbody></table></div><div class="muted-note">Las fechas son informativas en este piloto: la administración activa o cierra manualmente cada campaña. Al crear una nueva, se conservan los inventarios y se reinicia el estado de envío.</div></section>`}
function submissionPage(){const key=`${campaign()?.id}|${ui.center}`;const sent=data.submissions[key];const rows=currentRows();const invalid=rows.filter(i=>i.available>i.ok||[i.ok,i.broken,i.obsolete].some(n=>n<0));return heading('Revisión y envío','Confirma el inventario y las necesidades antes de finalizar la campaña.')+`<div class="banner ${sent?'':'warn'}"><div><strong>${sent?'Inventario enviado':'Inventario pendiente de envío'}</strong><p>${sent?'Enviado el '+new Date(sent.at).toLocaleString('es-ES')+'. Administración puede reabrirlo para correcciones.':'Revisa las cantidades antes de confirmar. El envío genera una captura histórica.'}</p></div>${statusTag(sent?'Enviada':'Pendiente')}</div><div class="cards">${stat('▤','Grupos de inventario',rows.length)}${stat('▣','Unidades totales',rows.reduce((s,i)=>s+total(i),0))}${stat('✚','Necesidades',data.needs.filter(n=>n.center===ui.center).length)}${stat('⚠','Errores detectados',invalid.length)}</div><section class="panel"><h2>Confirmación</h2><p>Enviar guarda una copia del inventario y las solicitudes correspondientes a esta campaña. Una vez enviado, los datos quedan bloqueados hasta su reapertura por administración.</p><button class="btn primary" data-act="submit" ${!isEditable()||invalid.length?'disabled':''}>✓ Enviar inventario</button></section>`}
function reports(){const rows=data.inventory;return heading('Informes y estadísticas','Resultados de los cinco centros ficticios, exportables a CSV.',`<button class="btn" data-act="csv-inventory">Exportar inventario</button><button class="btn" data-act="csv-needs">Exportar necesidades</button>`)+`<div class="cards">${stat('▣','Total de unidades',rows.reduce((s,i)=>s+total(i),0))}${stat('✓','Operativas',rows.reduce((s,i)=>s+i.ok,0))}${stat('⚠','Averiadas',rows.reduce((s,i)=>s+i.broken,0))}${stat('◷','Obsoletas',rows.reduce((s,i)=>s+i.obsolete,0))}</div><section class="panel"><h2>Unidades por categoría</h2>${categoryStats(rows)}</section>`}
function historyPage(){return heading('Historial de actividad','Registros recientes de la demostración, conservados en este navegador.')+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha y hora</th><th>Actividad</th></tr></thead><tbody>${data.history.map(h=>`<tr><td class="nowrap">${new Date(h.at).toLocaleString('es-ES')}</td><td>${escape(h.label)}</td></tr>`).join('')}</tbody></table></div></section>`}
function render(){if(ui.role==='centro'&&['centros','campanas','informes'].includes(ui.page))ui.page='inicio';const title={inicio:'Inicio',inventario:'Inventario',necesidades:'Necesidades',envio:'Revisión',centros:'Centros',campanas:'Campañas',informes:'Informes',historial:'Historial'}[ui.page];const content={inicio:dashboard,inventario:inventory,necesidades:needs,envio:submissionPage,centros:centersPage,campanas:campaignsPage,informes:reports,historial:historyPage}[ui.page]||dashboard;$('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="mark">▦</span><div>Inventario TIC <small>LEÓN · PILOTO</small></div></div><div class="nav">${nav()}</div><div class="sidebar-foot">Versión de demostración<br>Sin servidor ni acceso Educacyl<br>Datos guardados en este navegador</div></aside><div class="workspace"><header class="topbar"><div><strong>${escape(title)}</strong><span class="small muted">${ui.role==='admin'?'Administración provincial · Demostración':escape(center().name)+' · '+escape(center().id)}</span></div><div class="top-right"><span class="pill demo">DATOS FICTICIOS</span><button class="rolebtn ${ui.role==='centro'?'selected':''}" data-role="centro">Vista centro</button><button class="rolebtn ${ui.role==='admin'?'selected':''}" data-role="admin">Administración</button>${ui.role==='centro'?`<select id="centerpicker" class="active-select" aria-label="Seleccionar centro piloto">${data.centers.map(c=>`<option value="${escape(c.id)}" ${ui.center===c.id?'selected':''}>${escape(c.name)}</option>`).join('')}</select>`:''}</div></header><main>${content()}<div class="muted-note">PILOTO LOCAL: los cinco centros y sus registros son ficticios. Esta versión no comparte datos entre navegadores ni proporciona seguridad multiusuario. No introducir inventarios reales. <button class="tinybtn" data-act="reset">Restablecer demostración</button></div></main></div></div>`;bind();}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{ui.page=b.dataset.page;ui.filter='';ui.category='';render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ui.role=b.dataset.role;ui.page='inicio';ui.filter='';render()});$('#centerpicker')?.addEventListener('change',e=>{ui.center=e.target.value;render()});$('#filter')?.addEventListener('input',e=>{const focus=e.target.selectionStart;ui.filter=e.target.value;render();const el=$('#filter');el?.focus();el?.setSelectionRange(focus,focus)});$('#category')?.addEventListener('change',e=>{ui.category=e.target.value;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions(b.dataset.act));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>itemModal(data.inventory.find(i=>i.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este grupo del inventario?')){data.inventory=data.inventory.filter(i=>i.id!==b.dataset.delete);log('Material eliminado en '+center().name);store();render();toast('Material eliminado')}});document.querySelectorAll('[data-neededit]').forEach(b=>b.onclick=()=>needModal(data.needs.find(n=>n.id===b.dataset.neededit)));document.querySelectorAll('[data-needdelete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta necesidad?')){data.needs=data.needs.filter(n=>n.id!==b.dataset.needdelete);log('Necesidad eliminada en '+center().name);store();render();toast('Necesidad eliminada')}});document.querySelectorAll('[data-needstate]').forEach(b=>b.onclick=()=>stateModal(b.dataset.needstate));document.querySelectorAll('[data-centeropen]').forEach(b=>b.onclick=()=>{ui.center=b.dataset.centeropen;ui.role='centro';ui.page='inicio';render()});document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{if(confirm('¿Reabrir la entrega de este centro?')){delete data.submissions[`${campaign().id}|${b.dataset.reopen}`];log('Entrega reabierta: '+b.dataset.reopen);store();render();toast('Entrega reabierta')}});document.querySelectorAll('[data-togglecamp]').forEach(b=>b.onclick=()=>{const c=data.campaigns.find(x=>x.id===b.dataset.togglecamp);if(c){c.status=c.status==='Abierta'?'Cerrada':'Abierta';log(`Campaña ${c.name}: ${c.status}`);store();render();toast('Estado de campaña actualizado')}});document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>{data.activeCampaign=b.dataset.activate;store();render()})}
const option=(arr,current)=>arr.map(v=>`<option value="${escape(v)}" ${String(current)===String(v)?'selected':''}>${escape(v)}</option>`).join('');const field=(label,name,value='',type='text',required=false)=>`<div class="form-field"><label for="f-${name}">${label}</label><input class="field" id="f-${name}" name="${name}" type="${type}" value="${escape(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''}></div>`;const select=(label,name,arr,v)=>`<div class="form-field"><label for="f-${name}">${label}</label><select class="field" id="f-${name}" name="${name}">${option(arr,v)}</select></div>`;
function modal(title,subtitle,body,submit,saveLabel='Guardar'){const e=document.createElement('div');e.className='modal-overlay';e.innerHTML=`<div class="modal"><h2>${escape(title)}</h2><p>${escape(subtitle)}</p><form id="modalForm"><div class="form-grid">${body}</div><div class="modal-foot"><button type="button" class="btn" id="cancelModal">Cancelar</button><button class="btn primary" type="submit">${escape(saveLabel)}</button></div></form></div>`;document.body.appendChild(e);e.onclick=ev=>{if(ev.target===e)e.remove()};e.querySelector('#cancelModal').onclick=()=>e.remove();e.querySelector('form').onsubmit=ev=>{ev.preventDefault();try{if(submit(new FormData(ev.target))!==false)e.remove()}catch(err){alert(err.message||'Error de validación')}}}
const val=(f,k)=>String(f.get(k)||'').trim();const nval=(f,k)=>{let x=Number(f.get(k));if(!Number.isInteger(x)||x<0)throw Error('Las cantidades deben ser números enteros no negativos.');return x};
function itemModal(existing){if(!isEditable())return;const i=existing||{category:categories[0],type:'',brand:'',model:'',location:'',source:'Dotación educativa',year:'',ok:0,broken:0,obsolete:0,available:0,notes:''};const body=select('Categoría','category',categories,i.category)+field('Tipo de equipo','type',i.type,'text',true)+field('Marca','brand',i.brand)+field('Modelo','model',i.model)+field('Ubicación','location',i.location)+select('Procedencia','source',['Dotación educativa','Compra del centro','Cesión','Otros'],i.source)+field('Año de dotación (opcional)','year',i.year,'number')+field('Operativos','ok',i.ok,'number',true)+field('Averiados','broken',i.broken,'number',true)+field('Obsoletos','obsolete',i.obsolete,'number',true)+field('Disponibles para redistribución','available',i.available,'number',true)+`<div class="form-field full"><label>Observaciones</label><textarea class="field" name="notes">${escape(i.notes)}</textarea></div>`;modal(existing?'Editar material':'Añadir material','Un registro representa un grupo de equipos homogéneos del centro.',body,f=>{const obj={id:existing?.id||uid('I'),center:ui.center,category:val(f,'category'),type:val(f,'type'),brand:val(f,'brand'),model:val(f,'model'),location:val(f,'location'),source:val(f,'source'),year:val(f,'year'),ok:nval(f,'ok'),broken:nval(f,'broken'),obsolete:nval(f,'obsolete'),available:nval(f,'available'),notes:val(f,'notes')};if(!obj.type)throw Error('Indica el tipo de equipo.');if(obj.available>obj.ok)throw Error('Las unidades disponibles no pueden superar a las operativas.');if(obj.year&&(Number(obj.year)<1990||Number(obj.year)>2100))throw Error('Revisa el año.');if(existing)Object.assign(existing,obj);else data.inventory.push(obj);log((existing?'Material modificado':'Material añadido')+' · '+center().name+' · '+obj.type);store();render();toast('Inventario actualizado')})}
function needModal(existing){if(!isEditable())return;const n=existing||{category:categories[0],item:'',qty:1,priority:'Media',reason:'Insuficiencia',details:''};modal(existing?'Editar necesidad':'Nueva necesidad','La solicitud será revisada; no implica concesión.',select('Categoría','category',categories,n.category)+field('Equipamiento solicitado','item',n.item,'text',true)+field('Cantidad','qty',n.qty,'number',true)+select('Prioridad','priority',['Baja','Media','Alta'],n.priority)+select('Motivo','reason',['Insuficiencia','Avería','Obsolescencia','Nueva necesidad','Sustitución','Otros'],n.reason)+`<div class="form-field full"><label>Justificación pedagógica</label><textarea class="field" name="details" required>${escape(n.details)}</textarea></div>`,f=>{const obj={id:existing?.id||uid('N'),center:ui.center,category:val(f,'category'),item:val(f,'item'),qty:nval(f,'qty'),priority:val(f,'priority'),reason:val(f,'reason'),details:val(f,'details'),status:existing?.status||'Registrada',campaign:existing?.campaign||data.activeCampaign};if(!obj.item||!obj.details||obj.qty<1)throw Error('Completa el material, cantidad positiva y justificación.');if(existing)Object.assign(existing,obj);else data.needs.push(obj);log('Necesidad '+(existing?'modificada':'registrada')+' · '+center().name);store();render();toast('Necesidad guardada')})}
function stateModal(id){const n=data.needs.find(x=>x.id===id);if(!n)return;modal('Gestionar solicitud','Actualiza su estado de tramitación.',select('Estado','status',['Registrada','En revisión','Atendida','Descartada'],n.status),f=>{n.status=val(f,'status');log('Solicitud '+id+' actualizada a '+n.status);store();render();toast('Estado actualizado')},'Actualizar')}
function campaignModal(){modal('Nueva campaña','El inventario de los centros se conserva. Se reinicia el estado de envío.',field('Nombre de la campaña','name','Inventario TIC 2027-2028','text',true)+field('Fecha orientativa de inicio','start','2027-09-01','date')+field('Fecha orientativa de cierre','end','2027-12-20','date'),f=>{const name=val(f,'name');if(!name)throw Error('Indica un nombre.');const id=uid('C');data.campaigns.forEach(c=>c.status='Cerrada');data.campaigns.unshift({id,name,start:val(f,'start'),end:val(f,'end'),status:'Abierta'});data.activeCampaign=id;log('Nueva campaña abierta: '+name);store();render();toast('Campaña creada')},'Crear y abrir')}
function uid(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function csvCell(x){let s=String(x??'');return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function exportCSV(name,headers,rows){const csv='\ufeff'+[headers,...rows].map(row=>row.map(csvCell).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV descargado')}
function exportInventory(){const rows=currentRows();exportCSV('inventario_tic_leon_piloto.csv',['centro','categoria','tipo','marca','modelo','ubicacion','procedencia','anio','operativos','averiados','obsoletos','disponibles','observaciones'],rows.map(i=>[i.center,i.category,i.type,i.brand,i.model,i.location,i.source,i.year,i.ok,i.broken,i.obsolete,i.available,i.notes]))}
function exportNeeds(){exportCSV('necesidades_tic_leon_piloto.csv',['centro','categoria','material','cantidad','prioridad','motivo','justificacion','estado','campana'],data.needs.filter(n=>ui.role==='admin'||n.center===ui.center).map(n=>[n.center,n.category,n.item,n.qty,n.priority,n.reason,n.details,n.status,n.campaign]))}
function parseCSV(s){s=s.replace(/^\ufeff/,'');const sep=(s.split(/\r?\n/,1)[0].match(/;/g)||[]).length>=(s.split(/\r?\n/,1)[0].match(/,/g)||[]).length?';':',';const lines=[];let row=[],cell='',quoted=false;for(let k=0;k<s.length;k++){const ch=s[k];if(ch==='"'){if(quoted&&s[k+1]==='"'){cell+='"';k++}else quoted=!quoted}else if(ch===sep&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&s[k+1]==='\n')k++;row.push(cell);if(row.some(c=>c.trim()))lines.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(c=>c.trim()))lines.push(row);return lines}
function importModal(){if(!isEditable())return;const tmpl=()=>exportCSV('plantilla_inventario_tic.csv',['categoria','tipo','marca','modelo','ubicacion','procedencia','anio','operativos','averiados','obsoletos','disponibles','observaciones'],[[categories[0],'Ordenador portátil','HP','ProBook','Aula TIC','Dotación educativa','2023','20','2','0','0','Ejemplo: borrar esta fila']]);const e=document.createElement('div');e.className='modal-overlay';e.innerHTML=`<div class="modal"><h2>Importar inventario CSV</h2><p>Importa grupos de material desde una plantilla. Primero se revisan los datos; no se modifica el inventario automáticamente.</p><p><button class="btn" id="template">Descargar plantilla CSV</button></p><input type="file" id="csvfile" accept=".csv,text/csv" class="field" style="width:100%"><div id="preview" class="muted-note" style="margin-top:15px">Selecciona un archivo CSV para validar sus filas. Se añadirán al inventario del centro seleccionado.</div><div class="modal-foot"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="confirm" disabled>Confirmar importación</button></div></div>`;document.body.append(e);e.onclick=ev=>{if(ev.target===e)e.remove()};e.querySelector('#cancel').onclick=()=>e.remove();e.querySelector('#template').onclick=tmpl;let parsed=[];e.querySelector('#csvfile').onchange=async ev=>{parsed=[];e.querySelector('#confirm').disabled=true;try{const txt=await ev.target.files[0].text();const all=parseCSV(txt);const h=all.shift().map(x=>x.trim().toLowerCase());const required=['categoria','tipo','operativos','averiados','obsoletos','disponibles'];if(required.some(x=>!h.includes(x)))throw Error('Faltan columnas obligatorias: '+required.join(', '));const errors=[];all.forEach((r,idx)=>{const v=k=>r[h.indexOf(k)]||'';const n=k=>Number(v(k));if(!categories.includes(v('categoria'))||!v('tipo').trim()||['operativos','averiados','obsoletos','disponibles'].some(k=>!Number.isInteger(n(k))||n(k)<0)||n('disponibles')>n('operativos'))errors.push('Fila '+(idx+2));else parsed.push({id:uid('I'),center:ui.center,category:v('categoria'),type:v('tipo'),brand:v('marca'),model:v('modelo'),location:v('ubicacion'),source:v('procedencia'),year:v('anio'),ok:n('operativos'),broken:n('averiados'),obsolete:n('obsoletos'),available:n('disponibles'),notes:v('observaciones')})});if(errors.length)throw Error('Filas con errores: '+errors.slice(0,12).join(', '));if(!parsed.length)throw Error('No hay filas para importar.');e.querySelector('#preview').innerHTML=`<strong>${parsed.length} filas válidas</strong><p>Ejemplos: ${parsed.slice(0,4).map(i=>escape(i.type+' '+i.brand+' '+i.model)).join(' · ')}</p><p>Se añadirán como nuevas filas; revisa duplicados antes de confirmar.</p>`;e.querySelector('#confirm').disabled=false}catch(err){e.querySelector('#preview').textContent='Error: '+err.message}};e.querySelector('#confirm').onclick=()=>{data.inventory.push(...parsed);log('Importadas '+parsed.length+' filas en '+center().name);store();e.remove();render();toast('Importación completada')}}
function actions(act){if(act==='new-item')itemModal();else if(act==='new-need')needModal();else if(act==='new-campaign')campaignModal();else if(act==='csv-inventory')exportInventory();else if(act==='csv-needs')exportNeeds();else if(act==='import')importModal();else if(act==='submit'){if(!isEditable())return;if(!confirm('¿Confirmas el envío del inventario? No podrás modificarlo hasta que administración lo reabra.'))return;const key=`${campaign().id}|${ui.center}`;data.submissions[key]={at:new Date().toISOString(),inventory:structuredClone(currentRows()),needs:structuredClone(data.needs.filter(n=>n.center===ui.center))};log('Inventario enviado · '+center().name+' · '+campaign().name);store();render();toast('Inventario enviado correctamente')}else if(act==='reset'){if(confirm('¿Restablecer todos los datos ficticios del piloto en ESTE navegador? Se perderán los cambios de prueba.')){data=seed();ui={role:'centro',center:'DEMO-001',page:'inicio',filter:'',category:'',modal:null};store();render();toast('Piloto restablecido')}}}
render();
})();
</script></body></html>
